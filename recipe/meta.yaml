{% set version = "1.0.0" %}

package:
  name: sqlalchemy-redshift
  version: {{ version }}

source:
  url: https://github.com/sqlalchemy-redshift/sqlalchemy-redshift/archive/{{ version }}.tar.gz
  sha256: 5f7c9dda2c681c825fcf0154191df62479bf71baf9307688dfeebc2d81cd5bf3

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - setuptools
    - sqlalchemy >=0.9.2,<2.0.0
    - psycopg2 >=2.5
    - packaging

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - sqlalchemy_redshift
  commands:
    - pip check

about:
  home: https://github.com/sqlalchemy-redshift/sqlalchemy-redshift
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Amazon Redshift SQLAlchemy Dialect

  doc_url: https://sqlalchemy-redshift.readthedocs.io/en/latest/
  dev_url: https://github.com/sqlalchemy-redshift/sqlalchemy-redshift

extra:
  recipe-maintainers:
    - mcg1969
    - synapticarbors
    - igorborgest
